[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gendynamics"
version = "0.1.0"
description = "Diffusion and flow-matching models for PyTorch."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "diffusers>=0.35.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "POT>=0.9",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.7",
]

[project.optional-dependencies]
dev = [
  "flake8>=7.0",
  "pytest>=8.2.1",
  "pytest-cov>=5.0",
]
examples = [
  "matplotlib>=3.7.1",
]
vendor = [
  "Cython",
  "fsspec<=2025.3.0",
  "h5py>=3.15.1",
  "importlib-metadata<9",
  "requests>=2.31",
  "s3fs<=2025.3.0",
  "torchdiffeq",
  "torchquad",
  "torchvision>=0.20",
]

[project.urls]
Repository = "https://github.com/Diffusion-Research/gendynamics"

[tool.setuptools]
packages = ["gendynamics"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["gendynamics/tests"]

[tool.coverage.run]
source = ["gendynamics"]
omit = [
  "gendynamics/_vendor/*",
  "gendynamics/tests/*",
]

[tool.coverage.report]
omit = [
  "gendynamics/_vendor/*",
  "gendynamics/tests/*",
]
